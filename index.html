<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>Flash Utility</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Redirection vers HTTPS si nécessaire
      if (
        window.location.hostname !== "localhost" &&
        window.location.protocol === "http:"
      ) {
        window.location.href = "https:" + window.location.href.substring(5);
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <script type="module">
      import { Transport, ESPLoader } from 'https://unpkg.com/esptool-js@0.6.1/bundle.js';
      window.esptool = { Transport, ESPLoader };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <header class="header">
      <div class="left">
        <img src="assets/logo.jpeg" class="Logo" alt="Logo" />
      </div>
      <div class="right">
        <select id="baudRate"></select>
        <button id="butConnect" type="button">Connect</button>
      </div>
    </header>

    <main class="main">
      <div id="notSupported" class="notSupported" style="display: none;">
        Désolé, <b>Web Serial</b> n'est pas supporté sur cet appareil. Assurez-vous d'utiliser Chrome 89 ou une version ultérieure.
      </div>

      <div class="subheader">
        <div class="title left">PresTemp</div>
      </div>

      <div class="content">
        <div class="firmware-selector">
          <h2>Sélectionner un firmware</h2>
          <select id="firmware-picker">
            <option value="read" selected>Lecture</option>
            <option value="1m">Mesure 1 min</option>
            <option value="15m">Mesure 15 min</option>
            <option value="30m">Mesure 30 min</option>
            <option value="60m">Mesure 60 min</option>
          </select>
          <div id="firmware-info" style="margin-top: 20px;">
            <p id="firmware-description">Firmware sélectionné : <strong>PresTemp</strong> (Version : 1.X)</p>
          </div>
          <p><br></br></p>
          <div class="brand-sub"><a href="../">📍 - Visualisation des données</a></div>
        </div>

        <div class="program-section">
          <button id="programButton" type="button" disabled>Programmer</button>
          <button id="eraseButton" type="button" disabled>Effacer</button>
        </div>

        <div class="console-output">
          <h3>Console</h3>
          <div id="console" class="console"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026</p>
    </footer>

    <script>
      window.firmwareManifests = {
        "read": {
          name: "Lecture",
          version: "1.0",
          home_assistant_domain: null,
          new_install_prompt_erase: true,
          builds: [
            {
              chipFamily: "ESP32",
              improv: false,
              parts: [
                { path: "firmwares/bootloader.bin", offset: 0x1000 },
                { path: "firmwares/partitions.bin", offset: 0x8000 },
                { path: "firmwares/read.bin", offset: 0x10000 }
              ]
            }
          ]
        },

        "1m": {
          name: "Mesure 1min ",
          version: "1.0",
          home_assistant_domain: null,
          new_install_prompt_erase: true,
          builds: [
            {
              chipFamily: "ESP32",
              improv: false,
              parts: [
                { path: "firmwares/bootloader.bin", offset: 0x1000 },
                { path: "firmwares/partitions.bin", offset: 0x8000 },
                { path: "firmwares/1min.bin", offset: 0x10000 }
              ]
            }
          ]
        },

        "15m": {
          name: "Mesure 15min ",
          version: "1.0",
          home_assistant_domain: null,
          new_install_prompt_erase: true,
          builds: [
            {
              chipFamily: "ESP32",
              improv: false,
              parts: [
                { path: "firmwares/bootloader.bin", offset: 0x1000 },
                { path: "firmwares/partitions.bin", offset: 0x8000 },
                { path: "firmwares/15min.bin", offset: 0x10000 }
              ]
            }
          ]
        },

        "30m": {
          name: "Mesure 30min ",
          version: "1.0",
          home_assistant_domain: null,
          new_install_prompt_erase: true,
          builds: [
            {
              chipFamily: "ESP32",
              improv: false,
              parts: [
                { path: "firmwares/bootloader.bin", offset: 0x1000 },
                { path: "firmwares/partitions.bin", offset: 0x8000 },
                { path: "firmwares/30min.bin", offset: 0x10000 }
              ]
            }
          ]
        },

        "60m": {
          name: "Mesure 60min ",
          version: "1.0",
          home_assistant_domain: null,
          new_install_prompt_erase: true,
          builds: [
            {
              chipFamily: "ESP32",
              improv: false,
              parts: [
                { path: "firmwares/bootloader.bin", offset: 0x1000 },
                { path: "firmwares/partitions.bin", offset: 0x8000 },
                { path: "firmwares/60min.bin", offset: 0x10000 }
              ]
            }
          ]
        }
      };

      document.getElementById('firmware-picker').addEventListener('change', function() {
        const selectedFirmware = this.value;
        const firmware = window.firmwareManifests[selectedFirmware];
        document.getElementById('firmware-description').innerHTML =
          `Firmware sélectionné : <strong>${firmware.name}</strong> (Version : ${firmware.version})`;
      });
    </script>
    <script type="module" src="js/script.js"></script>
  </body>
</html>
